services:
  - type: web
    name: ai-trader-lobster-arena
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PAPER_TRADING_ALWAYS_OPEN
        value: "true"
      - key: AI_TRADER_API_BACKGROUND_TASKS
        value: "false"
      - key: AI_TRADER_BACKGROUND_TASKS
        value: lobster_arena_autorun
      - key: LOBSTER_ARENA_USE_LLM
        value: "false"
      - key: LOBSTER_ARENA_PUBLISH
        value: "false"
      - key: LOBSTER_ARENA_INCLUDE_API_AGENT
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-trader-lobster-arena-db
          property: connectionString
      - key: AI_TRADER_DEMO_AUTO_BOOTSTRAP
        value: "true"
      - key: AI_TRADER_DEMO_BOOTSTRAP_MODE
        value: when_empty
      - key: LLM_API_KEY
        sync: false
      - key: LLM_API_BASE
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4o-mini

databases:
  - name: ai-trader-lobster-arena-db
    databaseName: ai_trader_lobster_arena
    plan: free
